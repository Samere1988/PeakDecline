<section id="cmr2-play-area" class="mk64-play-area" hidden data-runtime-url="{{ url_for('main.retro_game_runtime', game_id='cmr2') }}">
 <div class="mk64-game-heading"><h1 data-game-title>Colin McRae Rally 2.0</h1><button data-game-restart class="mk64-secondary" type="button" hidden>Restart game for everyone</button></div>
 <div class="retro-frame-shell game-viewport">
  <button data-game-fullscreen class="mk64-fullscreen" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
  <div data-game-frame class="retro-game-frame game-surface"></div>
 </div>
 <p data-fullscreen-status role="status"></p>
 <div class="mk64-volume-control"><label for="cmr2-volume">Game volume</label><input id="cmr2-volume" data-game-volume type="range" min="0" max="100" value="70" aria-label="Game volume"><output for="cmr2-volume">70%</output><button data-enable-audio class="mk64-secondary" type="button">Enable sound</button></div>
 <p data-engine-status class="mk64-description" role="status"></p>
 <div data-player-tools>
  <p class="mk64-controls">Arrows steer / accelerate / brake · Space handbrake · Enter confirm · Esc back / pause. Gamepad: left stick steers · triggers accelerate / brake. Profiles save to your account.</p>
  <div data-controller-controls>{% set controller_id = 'cmr2' %}{% include 'retro/controller_setup.html' %}</div>
  <p data-save-status class="mk64-description" role="status"></p>
 </div>
</section>
