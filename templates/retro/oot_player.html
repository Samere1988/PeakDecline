<section id="oot-play-area" class="mk64-play-area" hidden data-runtime-url="{{ url_for('main.retro_game_runtime', game_id='oot') }}">
 <div class="mk64-game-heading"><h1 data-game-title>The Legend of Zelda: Ocarina of Time</h1></div>
 <div class="retro-frame-shell game-viewport">
  <button data-game-fullscreen class="mk64-fullscreen" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
  <div data-game-frame class="retro-game-frame game-surface"></div>
 </div>
 <p data-fullscreen-status role="status"></p>
 <div class="mk64-volume-control"><label for="oot-volume">Game volume</label><input id="oot-volume" type="range" min="0" max="100" value="70"><output for="oot-volume">70%</output><button data-enable-audio class="mk64-secondary" type="button">Enable sound</button></div>
 <p data-oot-status class="mk64-description" role="status"></p>
 <div data-player-tools>
  <button data-export-save class="mk64-secondary" type="button">Export Save</button>
  <button data-import-save-button class="mk64-secondary" type="button">Import Save</button><input data-import-save type="file" accept=".json,application/json" hidden>
  <p data-save-status role="status">Save in-game to keep your progress. Account sync status appears here.</p>
  <div id="oot-controller-controls">{% set controller_id = 'oot' %}{% include 'retro/controller_setup.html' %}</div>
 </div>
</section>
