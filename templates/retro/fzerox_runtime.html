<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-Zero X</title><style>
html,body{margin:0;width:100%;height:100%;background:#080c12;color:#fff;font-family:system-ui}
canvas{display:block;width:100%;height:100%;object-fit:contain}#status{position:absolute;left:1rem;top:1rem}
</style></head><body data-save-key="{{ current_user.get_id() }}"><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="F-Zero X"></canvas>
<p id="status" role="status">Loading F-Zero X…</p>
<script src="{{ url_for('static', filename='js/netplay/game_audio.js') }}"></script>
<script src="/static/js/account_sync.js?v=1"></script>
<script>
(() => {
    'use strict';
    let started = false;
    window.resumePeakGameAudio = () => {
        const audio = window.Module?.SDL2?.audioContext;
        if (audio?.state === 'suspended') audio.resume().catch(() => {});
    };
    // The native loop ran one frame per 60 Hz timer tick and skipped the tick whenever
    // the input row was late, never making that time up. Poll every 4 ms instead and let
    // this clock decide when a frame is due, catching up at most three frames.
    const paceFrames = () => {
        if (typeof _emscripten_set_main_loop_timing !== 'function') return;
        const bridge = window.peakGameBridge, ready = bridge.ready.bind(bridge), step = 1000 / 60;
        let due;
        bridge.ready = frame => {
            const now = performance.now();
            due = Math.max(due ?? now, now - 3 * step);
            if (now < due) return 0;
            const result = ready(frame);
            if (result > 0) due += step;
            return result;
        };
        _emscripten_set_main_loop_timing(0, 4);
    };
    // The game's audio code reads how much of SDL's queue the browser has played. Real-time
    // playback differed between players whenever frames stalled, and the match desynced
    // (frame 899 on the title screen). Every player now uses the same sample rate, the
    // queue drains a fixed amount per game frame, and the browser plays from its own buffer.
    const audioRate = 48000, maxQueuedSeconds = 0.25;
    const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
    let audio;
    if (NativeAudioContext) {
        const FixedRateAudioContext = function(options) {
            try { return new NativeAudioContext({...options, sampleRate: audioRate}); }
            catch { return new NativeAudioContext(options); }
        };
        FixedRateAudioContext.prototype = NativeAudioContext.prototype;
        window.AudioContext = window.webkitAudioContext = FixedRateAudioContext;
        const createScriptProcessor = NativeAudioContext.prototype.createScriptProcessor;
        NativeAudioContext.prototype.createScriptProcessor = function(bufferSize, inputs, outputs) {
            const node = createScriptProcessor.call(this, bufferSize, inputs, outputs);
            if (inputs !== 0) return node;
            const state = audio = {pull: null, size: bufferSize, rate: this.sampleRate, budget: 0, chunks: [], offset: 0, queued: 0,
                scratch: this.createBuffer(outputs, bufferSize, this.sampleRate)};
            // SDL assigns its pull callback here; keep it for game frames instead of the audio clock.
            Object.defineProperty(node, 'onaudioprocess', {configurable: true, get: () => state.pull, set: pull => { state.pull = pull; }});
            node.addEventListener('audioprocess', ({outputBuffer}) => {
                let written = 0;
                while (written < outputBuffer.length && state.chunks.length) {
                    const chunk = state.chunks[0], count = Math.min(outputBuffer.length - written, chunk[0].length - state.offset);
                    for (let c = 0; c < outputBuffer.numberOfChannels; c++)
                        outputBuffer.getChannelData(c).set(chunk[Math.min(c, chunk.length - 1)].subarray(state.offset, state.offset + count), written);
                    written += count; state.offset += count; state.queued -= count;
                    if (state.offset === chunk[0].length) { state.chunks.shift(); state.offset = 0; }
                }
                for (let c = 0; c < outputBuffer.numberOfChannels; c++) outputBuffer.getChannelData(c).fill(0, written);
            });
            // A context that starts suspended makes SDL drain on a real-time timer; stop it.
            queueMicrotask(() => {
                const sdl = window.Module?.SDL2?.audio;
                if (sdl?.silenceTimer !== undefined) { clearInterval(sdl.silenceTimer); sdl.silenceTimer = undefined; }
            });
            return node;
        };
    }
    const feedAudio = () => {
        if (!audio?.pull) return;
        audio.budget += audio.rate / 60;
        while (audio.budget >= audio.size) {
            audio.budget -= audio.size;
            audio.pull({outputBuffer: audio.scratch});
            const chunk = Array.from({length: audio.scratch.numberOfChannels}, (_, c) => audio.scratch.getChannelData(c).slice());
            audio.chunks.push(chunk); audio.queued += audio.size;
        }
        // Bound playback latency if the browser stops consuming (hidden tab, suspended context).
        while (audio.queued > audio.rate * maxQueuedSeconds && audio.chunks.length > 1) {
            audio.queued -= audio.chunks.shift()[0].length - audio.offset; audio.offset = 0;
        }
    };
    // Drain once per completed frame, after the native call returns, at the same point for everyone.
    const syncAudio = () => {
        const bridge = window.peakGameBridge, completed = bridge.completed.bind(bridge);
        bridge.completed = (frame, hash) => { queueMicrotask(feedAudio); return completed(frame, hash); };
    };
    window.startPeakGame = () => {
        if (started || !window.peakGameBridge) return;
        started = true;
        const fail = error => {
            const message = error?.message || String(error);
            document.getElementById('status').textContent = message;
            window.peakGameBridge.failed(message);
        };
        if (!crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') {
            fail(new Error('F-Zero X requires HTTPS and browser cross-origin isolation.'));
            return;
        }
        window.addEventListener('error', event => fail(event.error || event.message));
        window.addEventListener('unhandledrejection', event => fail(event.reason));
        window.Module = {
            canvas: document.getElementById('canvas'), noInitialRun: true,
            locateFile: name => {{ build_url|tojson }} + name,
            print: text => console.log(text), printErr: text => console.error(text),
            onAbort: message => fail(new Error(message)),
            onRuntimeInitialized: async () => {
                try {
                    const response = await fetch({{ rom_url|tojson }});
                    if (!response.ok) throw new Error('F-Zero X game data could not be loaded.');
                    const bytes = new Uint8Array(await response.arrayBuffer());
                    if (bytes.length !== 16777216) throw new Error('F-Zero X game data is incomplete.');
                    Module.FS.writeFile('/game.z64', bytes);
                    await PeakSaves.fs(Module,{game:'fzerox',paths:{'sram.bin':'/saves/fzerox.sav'},bridge:window.peakGameBridge});
                    Module.callMain([]);
                    paceFrames();
                    syncAudio();
                    document.getElementById('status').hidden = true;
                } catch (error) { fail(error); }
            }
        };
        const script = document.createElement('script');
        script.src = {{ build_url|tojson }} + 'fzerox.js';
        script.onerror = () => fail(new Error('F-Zero X could not be downloaded.'));
        document.body.append(script);
    };
})();
</script></body></html>
