<section id="marioparty-play-area" class="mk64-play-area" hidden aria-label="Mario Party game"
         data-runtime-url="{{ url_for('main.retro_game_runtime', game_id='marioparty') }}">
  <div class="mk64-game-heading"><h1 data-game-title>Mario Party</h1>
    <button data-game-restart class="mk64-secondary" type="button" hidden>Restart game for everyone</button></div>
  <div class="retro-frame-shell game-viewport">
    <button data-game-fullscreen class="mk64-fullscreen" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
    <div data-game-frame class="retro-game-frame game-surface"></div>
    {% from 'retro/n64_touch.html' import controls with context %}
    {{ controls('marioparty', 'marioparty') }}
  </div>
  <p data-fullscreen-status class="mk64-description" role="status"></p>
  <div class="mk64-volume-control"><label for="marioparty-volume">Game volume</label><input id="marioparty-volume" data-game-volume type="range" min="0" max="100" value="100" aria-label="Game volume"><output data-game-volume-value for="marioparty-volume">100%</output></div>
  <p class="mk64-controls">Keyboard: arrows move · Enter Start · X A · C B · Z Z · A / S L / R · I J K L C buttons</p>
  <div data-lobby-controller>
  {% set controller_id = 'marioparty' %}{% include 'retro/controller_setup.html' %}
  </div>
</section>
