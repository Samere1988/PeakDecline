# BEGIN LIVE TV ACCESS
location ^~ /static/stream/ {
    # Only the encoder's known media layout may be delivered by nginx.
    if ($uri !~ "^/static/stream/[0-9]+/([012]/)?(index\.m3u8|seg_[a-f0-9]{8}_[0-9]+\.ts)$") {
        return 404;
    }
    auth_request /_live_media_auth;
    alias /home/samer/servers/peakdecline/static/stream/;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /_live_media_auth {
    internal;
    proxy_pass http://127.0.0.1:8000/api/live/media-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# END LIVE TV ACCESS
