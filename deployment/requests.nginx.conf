# Include inside the existing nginx http block once DNS, TLS and Overseerr are ready.
server {
    listen 80;
    server_name requests.peakdecline.com;
    location /.well-known/acme-challenge/ {
        root "C:/Users/Plex/Desktop/New folder/nginx-1.27.5/acme";
    }
    location / { return 301 https://requests.peakdecline.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name requests.peakdecline.com;
    ssl_certificate "C:/Users/Plex/Desktop/New folder/nginx-1.27.5/ssl/requests.peakdecline.com-chain.pem";
    ssl_certificate_key "C:/Users/Plex/Desktop/New folder/nginx-1.27.5/ssl/requests.peakdecline.com-key.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
    }
}
