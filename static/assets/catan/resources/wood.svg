<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="title desc">
  <title id="title">Wood resource</title>
  <desc id="desc">A warm illustrated wood resource card with a stylized forest and logs.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9cbd71"/><stop offset=".46" stop-color="#5e8e56"/><stop offset="1" stop-color="#315f4b"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c5d78c" stop-opacity=".62"/><stop offset="1" stop-color="#6d9d66" stop-opacity="0"/></linearGradient>
    <linearGradient id="log" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b77748"/><stop offset=".54" stop-color="#7a4b38"/><stop offset="1" stop-color="#4c3a35"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#1d3b35" flood-opacity=".38"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><path d="M0 4h22M0 13h22" stroke="#f2e9b4" stroke-opacity=".12" stroke-width="2"/></pattern>
  </defs>

  <rect x="10" y="10" width="300" height="400" rx="24" fill="#263d3d" filter="url(#shadow)"/>
  <rect x="18" y="18" width="284" height="384" rx="19" fill="url(#card)" stroke="#d6dfad" stroke-opacity=".72" stroke-width="3"/>
  <rect x="22" y="22" width="276" height="178" rx="16" fill="url(#sky)"/>

  <!-- distant forest -->
  <path d="M25 196 Q77 154 124 185T211 177 298 187V242H25Z" fill="#416f4e" opacity=".72"/>
  <g fill="#315e48" opacity=".9">
    <path d="m45 190 33-91 33 91z"/><path d="m86 190 33-111 35 111z"/><path d="m151 190 35-98 36 98z"/><path d="m218 190 31-85 35 85z"/>
  </g>
  <g fill="#7fa35c" opacity=".9"><circle cx="70" cy="111" r="16"/><circle cx="123" cy="76" r="18"/><circle cx="181" cy="100" r="15"/><circle cx="246" cy="104" r="17"/></g>

  <!-- foreground ground -->
  <path d="M19 209 Q75 179 130 214T302 198V402H19Z" fill="#4e7f50" opacity=".86"/>
  <path d="M20 246 Q78 216 132 247T301 235" fill="none" stroke="#a9bd74" stroke-width="7" opacity=".42"/>
  <path d="M20 305 Q82 278 143 307T301 296" fill="none" stroke="#315f46" stroke-width="9" opacity=".34"/>

  <!-- illustrated log bundle -->
  <g filter="url(#shadow)" transform="rotate(-8 160 306)">
    <path d="M60 294 233 245l24 56-171 52z" fill="url(#log)" stroke="#402f2d" stroke-width="4"/>
    <path d="M53 304 70 353l171-51-16-48z" fill="#684437" stroke="#3f3030" stroke-width="4"/>
    <path d="M60 294 232 245l18 8-172 53z" fill="#ca8b52" opacity=".65"/>
    <g fill="#e0a76c" stroke="#4e3430" stroke-width="3"><ellipse cx="74" cy="324" rx="18" ry="27" transform="rotate(-17 74 324)"/><ellipse cx="102" cy="315" rx="18" ry="27" transform="rotate(-17 102 315)"/><ellipse cx="131" cy="306" rx="18" ry="27" transform="rotate(-17 131 306)"/></g>
    <g fill="none" stroke="#77503d" stroke-width="3"><ellipse cx="74" cy="324" rx="8" ry="15" transform="rotate(-17 74 324)"/><ellipse cx="102" cy="315" rx="8" ry="15" transform="rotate(-17 102 315)"/><ellipse cx="131" cy="306" rx="8" ry="15" transform="rotate(-17 131 306)"/></g>
    <path d="M78 272 111 303M111 260l34 31M147 249l36 32M183 239l35 31" stroke="#d59b62" stroke-width="7" stroke-linecap="round" opacity=".66"/>
  </g>
  <rect x="22" y="22" width="276" height="380" rx="16" fill="url(#grain)" opacity=".5"/>
  <circle cx="268" cy="58" r="18" fill="#f5e7af" fill-opacity=".88"/>
  <path d="m268 46 4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" fill="#4f7d50"/>
</svg>
